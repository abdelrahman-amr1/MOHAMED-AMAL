<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة الحضور | عريسنا محمد 💍</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --color-bg-page: #f4efe6;
            --color-bg-card: #ffffff;
            --gold-primary: #c5a059;
            --gold-dark: #8c6d32;
            --olive-dark: #2f402c;
            --olive-medium: #4e634a;
            --olive-light: #7b9476;
            --text-main: #2b2823;
            --text-muted: #6b665c;
            --success-color: #2e7d32;
            --danger-color: #c62828;
            --radius-card: 16px;
            --shadow-card: 0 10px 24px rgba(47, 64, 44, 0.08);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--color-bg-page);
            font-family: 'Cairo', sans-serif;
            color: var(--text-main);
            direction: rtl;
            text-align: right;
            min-height: 100vh;
            padding: 20px 14px 60px;
        }

        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .dash-header {
            background: linear-gradient(135deg, var(--olive-dark), #1d281b);
            color: #ffffff;
            border-radius: var(--radius-card);
            padding: 26px 20px;
            text-align: center;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
            border: 1px solid var(--gold-primary);
        }

        .dash-header::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.25) 0%, transparent 70%);
        }

        .dash-header h1 {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2rem;
            color: #f7e6c4;
            margin-bottom: 4px;
        }

        .dash-header p {
            font-size: 0.95rem;
            color: #d1dacb;
        }

        .header-actions {
            margin-top: 16px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 8px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: var(--gold-primary);
            color: #2b1f07;
            border-color: #dfbe7a;
        }

        .btn-refresh:hover {
            background: #dfbe7a;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 14px;
        }

        .stat-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-card);
            padding: 18px 16px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(197, 160, 89, 0.25);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px rgba(47, 64, 44, 0.12);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .stat-icon.total { background: rgba(197, 160, 89, 0.15); color: var(--gold-dark); }
        .stat-icon.attending { background: rgba(46, 125, 50, 0.15); color: var(--success-color); }
        .stat-icon.guests { background: rgba(33, 150, 243, 0.15); color: #1976d2; }
        .stat-icon.declined { background: rgba(198, 40, 40, 0.15); color: var(--danger-color); }

        .stat-info .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--olive-dark);
            line-height: 1.2;
        }

        .stat-info .stat-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Search & Filter Bar */
        .controls-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-card);
            padding: 16px;
            box-shadow: var(--shadow-card);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }

        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-wrap i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold-dark);
        }

        .search-wrap input {
            width: 100%;
            padding: 10px 40px 10px 14px;
            border-radius: 50px;
            border: 1.5px solid #dcd4c6;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .search-wrap input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.2);
        }

        .filter-buttons {
            display: flex;
            gap: 6px;
        }

        .btn-filter {
            background: #f4efe6;
            border: 1px solid #dcd4c6;
            border-radius: 50px;
            padding: 8px 14px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-filter.active {
            background: var(--olive-dark);
            color: #ffffff;
            border-color: var(--olive-dark);
        }

        /* Guest Cards / List */
        .guests-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .guest-row-card {
            background: var(--color-bg-card);
            border-radius: var(--radius-card);
            padding: 18px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(197, 160, 89, 0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: var(--transition);
            animation: fadeIn 0.3s ease;
        }

        .guest-row-card:hover {
            border-color: var(--gold-primary);
        }

        .guest-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .guest-name-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .guest-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(197, 160, 89, 0.2);
            color: var(--gold-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .guest-fullname {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--olive-dark);
        }

        .guest-timestamp {
            font-size: 0.75rem;
            color: #999;
        }

        .guest-badges {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-status {
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-status.attending {
            background: rgba(46, 125, 50, 0.12);
            color: var(--success-color);
            border: 1px solid rgba(46, 125, 50, 0.3);
        }

        .badge-status.declined {
            background: rgba(198, 40, 40, 0.12);
            color: var(--danger-color);
            border: 1px solid rgba(198, 40, 40, 0.3);
        }

        .badge-count {
            background: #f4efe6;
            color: var(--olive-dark);
            padding: 4px 10px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid #dcd4c6;
        }

        .guest-message-box {
            background: #faf7f2;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-main);
            border-right: 3px solid var(--gold-primary);
            line-height: 1.5;
        }

        /* Empty & Loading states */
        .state-box {
            background: var(--color-bg-card);
            border-radius: var(--radius-card);
            padding: 40px 20px;
            text-align: center;
            box-shadow: var(--shadow-card);
            color: var(--text-muted);
        }

        .state-box i {
            font-size: 2.5rem;
            color: var(--gold-primary);
            margin-bottom: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(197, 160, 89, 0.3);
            border-top-color: var(--gold-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <!-- Header -->
        <header class="dash-header">
            <h1>لوحة متابعة الحضور والمباركات 💍</h1>
            <p>حفل زفاف محمد & امال | قاعات لامور (قاعة رويال) - ١٨ نوفمبر</p>
            
            <div class="header-actions">
                <button id="refresh-btn" class="btn-action btn-refresh">
                    <i class="fa-solid fa-rotate"></i>
                    <span>تحديث البيانات لايف</span>
                </button>
                <a href="https://docs.google.com/spreadsheets/d/1Odd3lXCRxP68fx7HcmizMSfESW8-cyYpX-2ct3IxyYY/edit" target="_blank" class="btn-action">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>فتح الشيت الأصلي</span>
                </a>
                <a href="index.html" target="_blank" class="btn-action">
                    <i class="fa-solid fa-envelope-open-text"></i>
                    <span>مشاهدة صفحة الدعوة</span>
                </a>
            </div>
        </header>

        <!-- Stats Grid -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-users-viewfinder"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">إجمالي الردود</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon attending"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-attending">0</div>
                    <div class="stat-label">المؤكد حضورهم</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon guests"><i class="fa-solid fa-person-shelter"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-headcount">0</div>
                    <div class="stat-label">إجمالي الأفراد (مع المرافقين)</div>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon declined"><i class="fa-solid fa-circle-xmark"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-declined">0</div>
                    <div class="stat-label">المعتذرين</div>
                </div>
            </div>
        </section>

        <!-- Search and Filter Bar -->
        <section class="controls-card">
            <div class="search-wrap">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="ابحث باسم الضيف...">
            </div>

            <div class="filter-buttons">
                <button class="btn-filter active" data-filter="all">الكل (<span id="count-all">0</span>)</button>
                <button class="btn-filter" data-filter="attending">الحاضرين (<span id="count-attending">0</span>)</button>
                <button class="btn-filter" data-filter="declined">المعتذرين (<span id="count-declined">0</span>)</button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading-state" class="state-box">
            <div class="spinner"></div>
            <p>جاري جلب أحدث بيانات الحضور من الشيت...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="state-box hidden">
            <i class="fa-regular fa-folder-open"></i>
            <p>لا توجد بيانات مطابقة للبحث أو التصفية</p>
        </div>

        <!-- Guests List Container -->
        <main id="guests-list" class="guests-container hidden"></main>

    </div>

    <script>
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1Odd3lXCRxP68fx7HcmizMSfESW8-cyYpX-2ct3IxyYY/gviz/tq?tqx=out:csv";

        let allGuests = [];
        let currentFilter = "all";

        document.addEventListener("DOMContentLoaded", () => {
            fetchSheetData();

            document.getElementById("refresh-btn").addEventListener("click", () => {
                fetchSheetData();
            });

            document.getElementById("search-input").addEventListener("input", () => {
                renderGuests();
            });

            document.querySelectorAll(".btn-filter").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".btn-filter").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentFilter = btn.getAttribute("data-filter");
                    renderGuests();
                });
            });
        });

        async function fetchSheetData() {
            showLoading(true);
            try {
                // إضافة timestamp لتفادي الكاش
                const url = `${SHEET_CSV_URL}&_nocache=${new Date().getTime()}`;
                const response = await fetch(url);
                const csvText = await response.text();
                
                parseCSV(csvText);
                updateStats();
                renderGuests();
            } catch (err) {
                console.error("Error fetching sheet data:", err);
                alert("حدث خطأ أثناء تحميل البيانات من الشيت، يرجى المحاولة مرة أخرى.");
            } finally {
                showLoading(false);
            }
        }

        // تحويل CSV إلى مصفوفة كائنات
        function parseCSV(csv) {
            allGuests = [];
            const lines = csv.split("\n");
            
            // البدء من السطر الثاني لتخطي العناوين
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // تقسيم الخلايا مع مراعاة علامات التنصيص
                const cols = [];
                let inQuotes = false;
                let current = '';
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        cols.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                cols.push(current.trim());

                if (cols.length >= 2) {
                    const timestamp = cols[0] || '';
                    const name = cols[1] || 'ضيف';
                    const status = cols[2] || 'حاضر';
                    const guests = parseInt(cols[3], 10) || (status.includes('حاضر') ? 1 : 0);
                    const message = cols[4] || '';

                    allGuests.push({
                        timestamp,
                        name,
                        status,
                        isAttending: status.includes('حاضر'),
                        guests,
                        message
                    });
                }
            }

            // ترتيب الأحدث أولاً
            allGuests.reverse();
        }

        function updateStats() {
            const total = allGuests.length;
            const attendingList = allGuests.filter(g => g.isAttending);
            const declinedList = allGuests.filter(g => !g.isAttending);
            
            const totalHeadcount = attendingList.reduce((sum, g) => sum + (g.guests > 0 ? g.guests : 1), 0);

            document.getElementById("stat-total").textContent = total;
            document.getElementById("stat-attending").textContent = attendingList.length;
            document.getElementById("stat-headcount").textContent = totalHeadcount;
            document.getElementById("stat-declined").textContent = declinedList.length;

            document.getElementById("count-all").textContent = total;
            document.getElementById("count-attending").textContent = attendingList.length;
            document.getElementById("count-declined").textContent = declinedList.length;
        }

        function renderGuests() {
            const container = document.getElementById("guests-list");
            const emptyState = document.getElementById("empty-state");
            const searchTerm = document.getElementById("search-input").value.trim().toLowerCase();

            let filtered = allGuests.filter(g => {
                // فلتر الحالة
                if (currentFilter === "attending" && !g.isAttending) return false;
                if (currentFilter === "declined" && g.isAttending) return false;
                
                // فلتر البحث
                if (searchTerm && !g.name.toLowerCase().includes(searchTerm)) return false;
                return true;
            });

            container.innerHTML = "";

            if (filtered.length === 0) {
                container.classList.add("hidden");
                emptyState.classList.remove("hidden");
                return;
            }

            emptyState.classList.add("hidden");
            container.classList.remove("hidden");

            filtered.forEach(guest => {
                const card = document.createElement("div");
                card.className = "guest-row-card";

                const firstLetter = guest.name.charAt(0);
                const statusBadge = guest.isAttending
                    ? `<span class="badge-status attending"><i class="fa-solid fa-check"></i> حاضر</span>`
                    : `<span class="badge-status declined"><i class="fa-solid fa-xmark"></i> معتذر</span>`;

                const countBadge = guest.isAttending
                    ? `<span class="badge-count"><i class="fa-solid fa-users"></i> ${guest.guests} أفراد</span>`
                    : '';

                const messageHtml = guest.message
                    ? `<div class="guest-message-box">"${escapeHtml(guest.message)}"</div>`
                    : '';

                card.innerHTML = `
                    <div class="guest-main-row">
                        <div class="guest-name-box">
                            <div class="guest-avatar">${firstLetter}</div>
                            <div>
                                <div class="guest-fullname">${escapeHtml(guest.name)}</div>
                                <div class="guest-timestamp"><i class="fa-regular fa-clock"></i> ${escapeHtml(guest.timestamp)}</div>
                            </div>
                        </div>
                        <div class="guest-badges">
                            ${statusBadge}
                            ${countBadge}
                        </div>
                    </div>
                    ${messageHtml}
                `;

                container.appendChild(card);
            });
        }

        function showLoading(isLoading) {
            const loader = document.getElementById("loading-state");
            const container = document.getElementById("guests-list");
            const emptyState = document.getElementById("empty-state");

            if (isLoading) {
                loader.classList.remove("hidden");
                container.classList.add("hidden");
                emptyState.classList.add("hidden");
            } else {
                loader.classList.add("hidden");
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement("div");
            div.innerText = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
